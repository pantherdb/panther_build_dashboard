# Publishes the dashboard to GitHub Pages on every push to main.
#
# The report is compiled into the bundle (docs/build_state.json is imported, not fetched), so the
# site is entirely static: build, upload, deploy. No .env file reaches CI - .env.production is
# gitignored - so the two VITE_ vars the build reads are set here instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Project Pages serve from a subpath. This one var drives both the Vite asset base and
          # the react-router basename, so they cannot drift.
          VITE_BASE_URL: /panther_build_dashboard/
          VITE_APP_ENV: production

      - name: Prepare the static site
        run: |
          # Pages has no SPA rewrite: any path without a file gets 404.html. Serving the app shell
          # there lets /release and every deep link boot at their own URL instead of dead-ending.
          cp dist/index.html dist/404.html
          # Serve the tree as-is; Jekyll would otherwise filter paths it considers private.
          touch dist/.nojekyll
          # The bundle treemap is a local build diagnostic, not part of the published site.
          rm -f dist/stats-treemap.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
